<head>

<link rel="manifest" href="manifest.webmanifest">

</script>
<script src="config.js"></script>

<style>
/* Layout: mobile app — sticky day bar on top, one view at a time (خطّط / جدولي / راجع / إعدادات), fixed tab bar at bottom */
:root {
  --bg: #F4F6F8;
  --surface: #FFFFFF;
  --ink: #1A2230;
  --muted: #5B6676;
  --line: #DDE2E8;
  --accent: #1F5FBF;        /* blue: focus, main actions */
  --accent-soft: #E3ECF9;
  --done: #1E8A4F;          /* green: achievement */
  --done-soft: #E2F3E9;
  --star: #D9650B;          /* orange: now, top 3, reminders */
  --star-soft: #FDEEDC;
  --q-now: #C62828;         /* red: urgent only */
  --q-now-soft: #FBE4E4;
  --q-short: #9A7400;       /* yellow: medium importance */
  --q-short-soft: #FFF4CC;
  /* category colors: blue, green, indigo, orange, purple, gray */
  --c1: #1F5FBF; --c2: #1E8A4F; --c3: #3F4BA8; --c4: #D9650B; --c5: #7E44B0; --c6: #6B7684;
  --font-display: "Cairo", "IBM Plex Sans Arabic", Tahoma, sans-serif;
  --font-body: "IBM Plex Sans Arabic", Tahoma, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F141B; --surface: #171E28; --ink: #E6EBF2; --muted: #94A0B0; --line: #283241;
    --accent: #6EA4F0; --accent-soft: #1A2A42; --done: #57C68A; --done-soft: #16301F;
    --star: #F5A04A; --star-soft: #3A2714; --q-now: #F27A72; --q-now-soft: #3A1C1B; --q-short: #EBC85A; --q-short-soft: #362E14;
    --c1: #6EA4F0; --c2: #57C68A; --c3: #8F98E8; --c4: #F5A04A; --c5: #C49AE8; --c6: #94A0B0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F141B; --surface: #171E28; --ink: #E6EBF2; --muted: #94A0B0; --line: #283241;
    --accent: #6EA4F0; --accent-soft: #1A2A42; --done: #57C68A; --done-soft: #16301F;
    --star: #F5A04A; --star-soft: #3A2714; --q-now: #F27A72; --q-now-soft: #3A1C1B; --q-short: #EBC85A; --q-short-soft: #362E14;
    --c1: #6EA4F0; --c2: #57C68A; --c3: #8F98E8; --c4: #F5A04A; --c5: #C49AE8; --c6: #94A0B0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; direction: rtl; }
[hidden] { display: none !important; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 110px; display: flex; flex-direction: column; gap: 20px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h2 { margin: 0; font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; text-wrap: balance; }
h3 { margin: 0; font-size: 1rem; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
section, .stack { display: flex; flex-direction: column; gap: 10px; }
.sechead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

/* Day bar */
/* Brand strip: app logo and name, with the Levantix mark */
.profchip { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-body); font-size: .8rem; font-weight: 600; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 99px; padding: 3px 10px; }
.brandbar { position: relative; }
.profmenu { position: absolute; top: calc(100% + 6px); inset-inline-end: 0; z-index: 20; min-width: 220px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 32px rgba(0,0,0,.18); padding: 6px; display: flex; flex-direction: column; }
.profmenu button { border: 0; background: none; text-align: start; padding: 10px 12px; border-radius: 10px; font-size: .95rem; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.profmenu button:hover, .profmenu button:focus-visible { background: var(--bg); }
.profmenu .cur { color: var(--accent); font-weight: 700; }
.profmenu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
.profmenu .sub { color: var(--muted); font-size: .85rem; }
.profrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.profrow .field { flex: 1 1 140px; }
.profrow .now { font-size: .78rem; font-weight: 700; color: var(--done); }
.brandbar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding-block: 20px 6px; }
@media (min-width: 900px) { .brandbar { padding-block: 28px 10px; } }
@media (display-mode: standalone) and (min-width: 900px) { .brandbar { padding-block: 32px 12px; } }
.brandbar .app { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brandbar .app img { width: 40px; height: 40px; border-radius: 11px; flex: none; }
.brandbar .bt { display: flex; flex-direction: column; align-items: center; line-height: 1.05; }
.brandbar .bt b { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; }
.brandbar .bt small { margin-top: 3px; padding-top: 3px; border-top: 1px solid var(--line); font-family: var(--font-mono); font-size: .58rem; font-weight: 600; color: var(--muted); letter-spacing: .14em; direction: ltr; }
.brandbar .hello { margin: 0; text-align: center; display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.brandbar .hello .g { font-size: .78rem; color: var(--muted); }
.brandbar .hello .nm { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brandbar .who { display: flex; justify-content: flex-end; }
.daybar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px 10px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
.daybar .title { flex: 1; min-width: 0; }
.daybar h1 { margin: 0; font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; line-height: 1.2; }
.daybar .sub { color: var(--muted); font-size: .82rem; }
.iconbtn { position: relative; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 1.1rem; flex: none; }
.todaybtn { height: 40px; padding-inline: 10px; border-radius: 12px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: .85rem; flex: none; }
.dot { position: absolute; top: 5px; inset-inline-end: 5px; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--surface); background: var(--done); }
.dot.warn { background: var(--q-short); }

/* Tab bar */
.tabbar { position: fixed; inset-inline: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 12px calc(6px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; }
.tabbar .in { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; max-width: 560px; }
.tab { border: 0; background: none; border-radius: 12px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; color: var(--muted); font-size: .8rem; }
.tab b { font-family: var(--font-display); font-size: 1rem; font-weight: 600; }
.tab[aria-current="true"] { background: var(--accent-soft); color: var(--accent); }

/* Controls */
.field { height: 44px; padding-inline: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); min-width: 0; }
.field:focus, textarea:focus { border-color: var(--accent); outline: none; }
input[type="time"].field { width: 118px; font-family: var(--font-mono); direction: ltr; text-align: center; font-variant-numeric: tabular-nums; padding-inline: 6px; }
select.field { padding-inline: 8px; }
.ltr { direction: ltr; text-align: left; }
.addform { display: flex; gap: 8px; flex-wrap: wrap; }
.addform .grow { flex: 1 1 170px; }
.btn { height: 44px; padding-inline: 18px; border-radius: 12px; border: 0; background: var(--accent); color: var(--surface); font-weight: 600; }
.ghost { height: 40px; padding-inline: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: .9rem; }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 4px 0; }
.danger { color: var(--q-now); border-color: var(--q-now); }
.del { border: 0; background: none; color: var(--muted); width: 32px; height: 32px; border-radius: 8px; font-size: 1.15rem; line-height: 1; flex: none; }
.del:hover { color: var(--q-now); background: var(--bg); }
textarea { width: 100%; min-height: 90px; resize: vertical; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); line-height: 1.8; }
.empty { color: var(--muted); font-size: .9rem; padding: 16px; border: 1px dashed var(--line); border-radius: 12px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.check { appearance: none; -webkit-appearance: none; flex: none; width: 24px; height: 24px; margin: 0; border: 2px solid var(--muted); border-radius: 8px; background: var(--surface); display: grid; place-items: center; cursor: pointer; }
.check:checked { background: var(--done); border-color: var(--done); }
.check:checked::after { content: ""; width: 6px; height: 11px; border: solid var(--surface); border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
.row-wrap { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.tip { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.tip h3 { color: var(--accent); }
.banner { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 14px; border-radius: 12px; background: var(--star-soft); font-size: .88rem; }

/* Category chip */
.cat { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--muted); white-space: nowrap; }
.cat i { width: 9px; height: 9px; border-radius: 50%; background: var(--cc); flex: none; }
.catsum { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.catsum .cat { font-size: .82rem; }
.catsum b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.fixtag { font-size: .72rem; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 0 8px; }

/* Stepper */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stepbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 6px 4px; font-size: .78rem; line-height: 1.3; color: var(--muted); display: flex; flex-direction: column; align-items: center; }
.stepbtn b { font-family: var(--font-display); font-size: 1rem; }
.stepbtn.doneStep { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-soft); }
.stepbtn[aria-current="true"] { color: var(--surface); background: var(--accent); border-color: var(--accent); }
.navrow { display: flex; justify-content: space-between; gap: 8px; align-items: center; }

/* Cards */
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.card .top { display: flex; align-items: flex-start; gap: 10px; }
.card .ttl { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 500; display: flex; flex-direction: column; gap: 2px; }
.qs { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.q { display: flex; gap: 6px; align-items: center; font-size: .85rem; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 4px 14px; font-size: .85rem; }
.seg button + button { border-inline-start: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.qtag { display: inline-flex; align-items: center; font-size: .76rem; font-weight: 600; border-radius: 99px; padding: 1px 10px; white-space: nowrap; }
.qtag.now { background: var(--q-now-soft); color: var(--q-now); }
.qtag.plan { background: var(--accent-soft); color: var(--accent); }
.qtag.short { background: var(--q-short-soft); color: var(--q-short); }
.qtag.drop { background: var(--bg); color: var(--muted); }
.starbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; height: 36px; padding-inline: 10px; font-size: .85rem; color: var(--muted); flex: none; }
.starbtn[aria-pressed="true"] { background: var(--star-soft); border-color: var(--star); color: var(--star); font-weight: 600; }
.timerow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: .85rem; color: var(--muted); }
.matrix { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: .8rem; }
.matrix div { border-radius: 10px; padding: 8px 10px; line-height: 1.4; }
.matrix b { display: block; font-size: .85rem; }
.matrix .now { background: var(--q-now-soft); color: var(--q-now); }
.matrix .plan { background: var(--accent-soft); color: var(--accent); }
.matrix .short { background: var(--q-short-soft); color: var(--q-short); }
.matrix .drop { background: var(--surface); color: var(--muted); border: 1px solid var(--line); }

/* Day view */
.progress { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: .85rem; }
.bar { flex: 1; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--done); transition: width .3s; }
.progress b { color: var(--ink); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.top3 { background: var(--star-soft); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.top3 h2 { color: var(--star); }
.top3 .row { display: flex; gap: 10px; align-items: center; }
.top3 .row .t { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.top3 .row.done .t { text-decoration: line-through; color: var(--muted); font-weight: 400; }
.top3 .check:checked { background: var(--star); border-color: var(--star); }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.slot { border-bottom: 1px dashed var(--line); padding-block: 10px; display: flex; flex-direction: column; gap: 8px; }
.slot:last-child { border-bottom: 0; }
.slot .row { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; align-items: start; }
.slot .time { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; font-size: .92rem; line-height: 1.3; padding-top: 2px; }
.slot .time small { display: block; color: var(--muted); font-weight: 400; font-size: .74rem; }
.slot .ttlbtn { border: 0; background: none; padding: 0; text-align: start; min-width: 0; overflow-wrap: anywhere; display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
.slot .meta { display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; }
.slot .note { color: var(--muted); font-size: .85rem; white-space: pre-wrap; }
.slot.done .ttl { text-decoration: line-through; color: var(--muted); }
.slot.now { background: var(--star-soft); border-radius: 12px; padding-inline: 10px; margin-inline: -10px; border-bottom-color: transparent; }
.nowtag { font-size: .72rem; font-weight: 700; color: var(--star); border: 1px solid var(--star); border-radius: 99px; padding: 0 8px; }
.startag { color: var(--star); font-size: .78rem; font-weight: 600; }
.editor { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); }
.slot.now .editor { background: var(--surface); }

/* Report */
.verdict { border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); border: 1px solid var(--line); }
.verdict .big { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; line-height: 1.3; }
.verdict.up { background: var(--done-soft); border-color: transparent; }
.verdict.up .big { color: var(--done); }
.verdict.down { background: var(--q-now-soft); border-color: transparent; }
.verdict.down .big { color: var(--q-now); }
.catrows { display: flex; flex-direction: column; gap: 12px; }
.catrow { display: flex; flex-direction: column; gap: 4px; }
.catrow .hd { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-size: .9rem; }
.catrow .hd b { font-family: var(--font-mono); font-size: .85rem; font-variant-numeric: tabular-nums; font-weight: 600; }
.catrow .bar { height: 8px; }
.catrow .bar > i { background: var(--cc); }
.trend { font-size: .78rem; font-weight: 600; }
.trend.up { color: var(--done); }
.trend.down { color: var(--q-now); }
.trend.flat { color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; text-align: center; }
.stat b { display: block; font-family: var(--font-mono); font-size: 1.4rem; font-variant-numeric: tabular-nums; line-height: 1.3; }
.stat span { font-size: .78rem; color: var(--muted); }
.left { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.left .t { flex: 1 1 140px; min-width: 0; overflow-wrap: anywhere; }
.rangeseg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.rangeseg button { border: 0; background: none; padding: 8px 4px; font-size: .9rem; color: var(--muted); }
.rangeseg button + button { border-inline-start: 1px solid var(--line); }
.rangeseg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); font-weight: 600; }
/* Daily bars: planned as a faint track, done in green on top */
.chartwrap { display: flex; flex-direction: column; gap: 6px; }
.legend { display: flex; gap: 14px; font-size: .78rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; }
.chart { position: relative; display: flex; align-items: flex-end; gap: 2px; height: 140px; padding-top: 20px; border-bottom: 1px solid var(--line); }
.chart::before { content: ""; position: absolute; top: 20px; inset-inline: 0; border-top: 1px dashed var(--line); }
.chart .max { position: absolute; top: 0; inset-inline-end: 0; font-size: .72rem; color: var(--muted); font-family: var(--font-mono); }
.chart .b { position: relative; flex: 1; min-width: 0; height: 100%; border: 0; padding: 0; background: none; cursor: pointer; }
.chart .b .p, .chart .b .d { position: absolute; bottom: 0; inset-inline: 0; border-radius: 4px 4px 0 0; }
.chart .b .p { background: var(--line); }
.chart .b .d { background: var(--done); }
.chart .b.sel .p { background: var(--muted); opacity: .35; }
.chart .b.sel .d { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--ink); }
.xlabels { display: flex; gap: 2px; }
.xlabels span { flex: 1; min-width: 0; text-align: center; font-size: .68rem; color: var(--muted); font-family: var(--font-mono); overflow: hidden; white-space: nowrap; }
.barinfo { font-size: .85rem; min-height: 1.4em; }
.toplist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.toplist li { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding-block: 8px; border-bottom: 1px dashed var(--line); font-size: .9rem; }
.toplist li:last-child { border-bottom: 0; }
.toplist b { font-family: var(--font-mono); font-weight: 600; font-size: .82rem; white-space: nowrap; }
.daybar .title { cursor: pointer; border-radius: 10px; }
.jump { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

/* Settings */
.wds { display: flex; flex-wrap: wrap; gap: 6px; }
.wd { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 3px 11px; font-size: .8rem; color: var(--muted); }
.wd[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }

.toast { position: fixed; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 99px; font-size: .85rem; z-index: 10; max-width: calc(100% - 32px); text-align: center; }
/* Account lock screen */
.lock { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }

/* Sleep */

.namecard { background: var(--accent-soft); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }

.daygrid > div { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

}

<body>

    <button class="tab" data-tab="day"><b>جدولي</b><span>تابع</span></button>
    <button class="tab" data-tab="review"><b>راجع</b><span>التقرير</span></button>
  </div>
</nav>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  // Accounts on this device (e.g. personal and work): each keeps its own data and cloud code.
  // The first account uses the original keys so existing data stays where it is.
  var PROFILES_KEY = "yawmi-profiles";
  var profiles = { active: "main", list: [{ id: "main", name: "شخصي" }] };
  try {
    var pj = JSON.parse(localStorage.getItem(PROFILES_KEY) || "null");
    if (pj && Array.isArray(pj.list) && pj.list.length) profiles = pj;
  } catch (e) {}
  if (!profiles.list.some(function (x) { return x.id === profiles.active; })) profiles.active = profiles.list[0].id;
  var PROFILE = profiles.active;
  function pkey(base, id) { id = id || PROFILE; return id === "main" ? base : base + ":" + id; }
  function saveProfiles() { try { localStorage.setItem(PROFILES_KEY, JSON.stringify(profiles)); } catch (e) {} }
  function profileName(id) { var x = profiles.list.filter(function (q) { return q.id === (id || PROFILE); })[0]; return x ? x.name : ""; }
  var KEY = pkey("daily-planner-v3"), OLD_KEY = "daily-planner-v2";
  var NAME_KEY = pkey("yawmi-username"), LOG_KEY = pkey("yawmi-pendinglog");
  var userName = "";
  try { userName = localStorage.getItem(NAME_KEY) || ""; } catch (e) {}
  var SPAN = 3; // days kept in the cloud before and after today
  var FUTURE = 365; // days ahead you can plan on this device; they sync once within SPAN
  var CFG = window.PLANNER_CONFIG || {};
  var $ = function (id) { return document.getElementById(id); };
  var view = $("view");

  /* ---------- helpers ---------- */
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function keyOf(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parseKey(k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function today() { var d = new Date(); d.setHours(0, 0, 0, 0); return d; }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function offsetOf(k) { return Math.round((parseKey(k) - today()) / 86400000); }
  function windowKeys() { var t = today(), a = []; for (var i = -SPAN; i <= SPAN; i++) a.push(keyOf(addDays(t, i))); return a; }
  function inWindow(k) { var o = offsetOf(k); return o >= -SPAN && o <= SPAN; }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function toMin(t) { if (!t) return null; var p = t.split(":"); return +p[0] * 60 + +p[1]; }
  function fromMin(m) { m = Math.max(0, Math.min(m, 23 * 60 + 59)); return pad(Math.floor(m / 60)) + ":" + pad(m % 60); }
  function fmt12(t) {
    if (!t) return "";
    var p = t.split(":"), h = +p[0], m = p[1], suf = h < 12 ? "ص" : "م";
    h = h % 12; if (h === 0) h = 12;
    return h + ":" + m + " " + suf;
  }
  function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
  function num(x) { return String(Math.round(x * 10) / 10); }
  function fmtH(m) { m = Math.round(m || 0); if (!m) return "0 س"; if (m < 60) return m + " د"; return num(m / 60) + " س"; }
  function durLabel(m) {
    if (m < 60) return m + " دقيقة";
    var h = m / 60;
    return h === 1 ? "ساعة" : h === 2 ? "ساعتان" : h <= 10 && h % 1 === 0 ? h + " ساعات" : num(h) + " ساعة";
  }
  function arr(x) { return Array.isArray(x) ? x : []; }
  var DURS = [15, 30, 45, 60, 90, 120, 150, 180, 240, 300];
  var WD_ORDER = [6, 0, 1, 2, 3, 4, 5]; // Saturday first
  var WD_SHORT = ["أحد", "إثنين", "ثلاثاء", "أربعاء", "خميس", "جمعة", "سبت"];
  var DEFAULT_CATS = [
    { id: "study", name: "الدراسة", color: 1 },
    { id: "worship", name: "العبادات", color: 2 },
    { id: "work", name: "العمل", color: 3 },
    { id: "health", name: "الصحة والرياضة", color: 4 },
    { id: "family", name: "الأسرة", color: 5 },
    { id: "other", name: "أخرى", color: 6 }
  ];
  function defaultCats() { return DEFAULT_CATS.map(function (c) { return { id: c.id, name: c.name, color: c.color }; }); }

  var QUAD = {
    now: { label: "افعلها أولًا" }, plan: { label: "خصّص لها وقتًا" },
    short: { label: "اختصرها أو فوّضها" }, drop: { label: "اتركها اليوم" }
  };
  function quad(it) {
    if (it.important == null || it.urgent == null) return null;
    if (it.important && it.urgent) return "now";
    if (it.important) return "plan";
    if (it.urgent) return "short";
    return "drop";
  }
  function qtag(it) { var q = quad(it); return q ? '<span class="qtag ' + q + '">' + QUAD[q].label + '</span>' : ""; }

  /* ---------- state ---------- */
  var state, storageOk = true;
  function blankState() {
    return { v: 3, days: {}, settings: { categories: defaultCats(), routines: [], updatedAt: 0 }, dirtyDays: {}, dirtySettings: 0 };
  }
  function blankDay() { return { items: [], good: "", improve: "", notes: "", startAt: "08:00", applied: [], updatedAt: 0 }; }
  function fixState() {
    if (!state.days) state.days = {};
    if (!state.settings) state.settings = blankState().settings;
    if (!arr(state.settings.categories).length) state.settings.categories = defaultCats();
    state.settings.routines = arr(state.settings.routines);
    if (!state.settings.sleep) state.settings.sleep = { hours: 7, wake: "05:00" };
    if (!state.dirtyDays) state.dirtyDays = {};
    Object.keys(state.days).forEach(function (k) {
      var d = state.days[k];
      d.items = arr(d.items); d.applied = arr(d.applied);
      d.items.forEach(function (i) { if (!i.cat) i.cat = "other"; if (!i.dur) i.dur = 60; });
    });
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { state = JSON.parse(raw); fixState(); return "ok"; }
    } catch (e) { storageOk = false; }
    state = blankState();
    // bring over days from the earlier version of the app
    if (PROFILE !== "main") return "";
    try {
      var o = JSON.parse(localStorage.getItem(OLD_KEY) || "null");
      if (o && o.days) {
        Object.keys(o.days).forEach(function (k) {
          if (k === o.sample || !inWindow(k)) return;
          var d = o.days[k];
          state.days[k] = { items: arr(d.items), good: d.good || "", improve: d.improve || "", notes: d.notes || "", startAt: d.startAt || "08:00", applied: [], updatedAt: Date.now() };
          state.dirtyDays[k] = Date.now();
        });
        fixState();
        if (Object.keys(state.days).length) return "migrated";
      }
    } catch (e) {}
    return "";
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { if (storageOk) toast("تعذّر الحفظ على هذا الجهاز"); storageOk = false; }
  }

  // Change tracking per item, so two devices editing the same day merge instead of overwriting:
  // a changed item gets a fresh `u`, a deleted one leaves a tombstone in d.del, notes get d.tu.
  var snap = {};
  function itemJson(i) { var o = {}; Object.keys(i).forEach(function (k) { if (k !== "u") o[k] = i[k]; }); return JSON.stringify(o); }
  function itemsMap(d) { var m = {}; d.items.forEach(function (i) { m[i.id] = itemJson(i); }); return m; }
  function textJson(d) { return JSON.stringify([d.good, d.improve, d.notes, d.startAt, d.sleep || null]); }
  function daySnap(d) { return { m: itemsMap(d), t: textJson(d), a: JSON.stringify(d.applied) }; }
  function setJson() { return JSON.stringify([state.settings.categories, state.settings.routines, state.settings.sleep || null]); }
  function isEmptyDay(d) { return !d.items.length && !d.good && !d.improve && !d.notes && !(d.sleep && (d.sleep.bed || d.sleep.wake)); }
  function takeSnap() {
    snap = { _s: setJson() };
    Object.keys(state.days).forEach(function (k) { snap[k] = daySnap(state.days[k]); });
  }
  function save() {
    var now = Date.now();
    Object.keys(state.days).forEach(function (k) {
      var d = state.days[k], cur = daySnap(d), old = snap[k], any = false, fresh = !old;
      snap[k] = cur;
      if (!old) { if (isEmptyDay(d)) return; old = { m: {}, t: textJson(blankDay()), a: "[]" }; }
      d.items.forEach(function (i) {
        if (old.m[i.id] === cur.m[i.id]) return;
        i.u = now; any = true;
        if (fresh) return;
        if (!old.m[i.id]) { if (!i.rid) logEvent("أضاف", i.title, k, "add:" + i.id); return; }
        var o = {}; try { o = JSON.parse(old.m[i.id]); } catch (e) {}
        if (!o.done && i.done) logEvent("أنجز", i.title, k, "done:" + i.id);
        else if (o.done && !i.done) logEvent("ألغى إنجاز", i.title, k, "done:" + i.id);
        else logEvent("عدّل", i.title, k, "edit:" + i.id);
      });
      Object.keys(old.m).forEach(function (id) {
        if (id in cur.m) return;
        d.del = d.del || {}; d.del[id] = now; any = true;
        var o = {}; try { o = JSON.parse(old.m[id]); } catch (e) {}
        if (!fresh) logEvent("حذف", o.title || "", k, "del:" + id);
      });
      if (old.t !== cur.t) { d.tu = now; any = true; if (!fresh) logEvent("كتب في مراجعة اليوم", "", k, "text:" + k); }
      if (old.a !== cur.a) any = true;
      if (any) d.updatedAt = now;
    });
    var s = setJson();
    if (snap._s !== s) { if (snap._s) logEvent("عدّل الإعدادات", "التقسيمات أو المهام الدائمة", "", "settings"); snap._s = s; state.settings.updatedAt = now; }
    persist();
    scheduleUpload();
  }
  // The cloud keeps 7 days; this device keeps an archive of past days (up to a year)
  var ARCHIVE = 365;
  function inArchive(k) { var o = offsetOf(k); return o >= -ARCHIVE && o <= FUTURE; }
  // Change log: queued on the device, uploaded with the next sync, read by the first owner
  var pendingLog = {};
  try { pendingLog = JSON.parse(localStorage.getItem(LOG_KEY) || "{}") || {}; } catch (e) {}
  function logEvent(action, title, dayKey, key) {
    if (typeof code !== "string" || !code || cloud.role !== "secondary") return;
    var n = new Date(), dm = function (d) { return d.getDate() + "/" + (d.getMonth() + 1); };
    var line = dm(n) + " " + pad(n.getHours()) + ":" + pad(n.getMinutes()) + " — " + action +
      (title ? " «" + String(title).slice(0, 120) + "»" : "") + (dayKey && dayKey !== keyOf(n) ? " (ليوم " + dm(parseKey(dayKey)) + ")" : "");
    pendingLog[key] = { line: line, at: n.toISOString() };
    try { localStorage.setItem(LOG_KEY, JSON.stringify(pendingLog)); } catch (e) {}
  }
  function flushLog() {
    var keys = Object.keys(pendingLog);
    if (!keys.length || !sb || !code) return;
    var sent = {}, list = keys.map(function (k) { sent[k] = pendingLog[k].at; return pendingLog[k]; })
      .sort(function (a, b) { return a.at < b.at ? -1 : 1; })
      .map(function (e) { return e.line || ((e.action || "") + " «" + (e.title || "") + "»"); });
    rpc("log_add", { p_code: code, p_events: list }).then(function (r) {
      if (r.error || r.data === false) return;
      keys.forEach(function (k) { if (pendingLog[k] && pendingLog[k].at === sent[k]) delete pendingLog[k]; });
      try { localStorage.setItem(LOG_KEY, JSON.stringify(pendingLog)); } catch (e) {}
    }, function () {});
  }
  function pruneLocal() {
    Object.keys(state.days).forEach(function (k) {
      var d = state.days[k];
      if (!inArchive(k) || (!inWindow(k) && isEmptyDay(d))) { delete state.days[k]; delete state.dirtyDays[k]; delete snap[k]; }
    });
  }

  var current = today();
  function dk() { return keyOf(current); }
  function day(k) {
    k = k || dk();
    if (!state.days[k]) state.days[k] = blankDay();
    return state.days[k];
  }
  function find(id) { return day().items.filter(function (x) { return x.id === id; })[0]; }
  function active(d) { return d.items.filter(function (i) { return !i.moved && quad(i) !== "drop"; }); }
  function cats() { return state.settings.categories; }
  function catOf(id) {
    var c = cats().filter(function (x) { return x.id === id; })[0];

    }).join("") + '</select>';
  }
  function durSelect(attrs, val) {
    val = val || 60;

    return '<select class="field" ' + attrs + ' aria-label="المدة">' + list.map(function (m) {
      return '<option value="' + m + '"' + (val === m ? " selected" : "") + '>' + durLabel(m) + '</option>';

  }

  // Standing tasks drop into today and the coming days on their chosen weekdays
  function applyRoutines(k) {
    if (offsetOf(k) < 0) return false;

      d.items.push({ id: "r-" + r.id + "-" + k, title: r.title, cat: r.cat, dur: r.dur || 60, time: r.time || "", important: true, urgent: false, top: false, done: false, spent: null, note: "", rid: r.id });
      d.applied.push(r.id);

    });
    return changed;
  }

  var ui = { tab: null, step: 1, open: null, lastCat: "study", lastDur: 60, newDays: [0, 1, 2, 3, 4, 5, 6], confirmWipe: false };

        ex("رياضة / مشي", "health", true, false, false, "17:00", 45, false),

        ex("تصفّح وسائل التواصل", "other", false, false, false, "", 30, false)

  function dropSample() {

  var loaded = load();

  var dayFmt, dateFmt, hijriFmt, hijriDayFmt, monthFmt, hijriMonthFmt;

  } catch (e) {}
  function dateLine(d) {
    var g = dateFmt ? dateFmt.format(d) : keyOf(d), h = "";

    return h ? g + " · " + h : g;
  }

  /* ---------- header + tabs ---------- */
  function renderHeader() {
    var diff = offsetOf(dk());
    var wd = dayFmt ? dayFmt.format(current) : "";
    var label = diff === 0 ? "اليوم" : diff === 1 ? "غدًا" : diff === -1 ? "أمس" : wd;
    $("dayName").textContent = (diff >= -1 && diff <= 1 && wd) ? label + "، " + wd : label;
    $("dayDate").textContent = dateLine(current);
    $("goToday").hidden = diff === 0;

  function defaultTab() {

  function render() {
    pendingRender = false;
    if (applyRoutines(dk())) save();

    var html = "";

    }

    }

    view.innerHTML = '<div class="stack" style="gap:20px;padding-top:16px">' + html + '</div>';
    drawQr();
  }
  function drawQr() {
    var box = $("qrBox");

    box.removeAttribute("title");
  }

  /* ---------- PLAN ---------- */
  var STEPS = [{ n: 1, short: "أفرغ ذهنك" }, { n: 2, short: "ميّز المهم" }, { n: 3, short: "اختر ٣" }, { n: 4, short: "حدّد الوقت" }];
  function planView() {
    var d = day();
    var h = '<div class="steps">' + STEPS.map(function (s) {
      return '<button class="stepbtn' + (s.n < ui.step ? " doneStep" : "") + '" data-act="step" data-n="' + s.n + '" aria-current="' + (s.n === ui.step) + '"><b>' + s.n + '</b>' + s.short + '</button>';
    }).join("") + '</div>';
    return h + [null, step1, step2, step3, step4][ui.step](d);
  }
  function itemTitle(it) {
    return '<span>' + (it.top ? '<span class="startag">★ </span>' : "") + esc(it.title) + '</span>' +
      '<span class="row-wrap" style="gap:4px 10px">' + catChip(it.cat) + '<span class="cat">' + durLabel(it.dur || 60) + '</span>' + (it.rid ? '<span class="fixtag">دائمة</span>' : "") + '</span>';
  }
  function step1(d) {
    var h = '<section><h2>اكتب كل ما في رأسك</h2>' +
      '<p class="muted small">كل ما تريد أو تحتاج أن تعمله اليوم، مع تقسيمه وكم يأخذ من الوقت. لا ترتّب الآن، فقط اكتب. المهام الدائمة تنزل هنا تلقائيًا.</p>' +
      '<form class="addform" data-form="dump"><input class="field grow" id="dumpInput" type="text" placeholder="مثال: دراسة قانون" autocomplete="off">' +
      catSelect('id="dumpCat"', ui.lastCat) + durSelect('id="dumpDur"', ui.lastDur) +
      (voiceSupported() ? '<button type="button" class="ghost mic' + (voice.on ? " live" : "") + '" data-act="voice" aria-pressed="' + voice.on + '">' + (voice.on ? "⏹ أوقف" : "🎤 بالصوت") + '</button>' : "") +
      '<button class="btn" type="submit">أضف</button></form>' +
      (voice.on ? '<p class="small voicehint">🔴 أستمع… قل البند ثم قل <b>«أضف»</b>، مثل: «دراسة قانون أضف». وقل <b>«توقف»</b> للإنهاء.</p>' :
        voiceSupported() ? '<p class="small muted">يمكنك الإملاء بالصوت: اضغط 🎤 وقل البند ثم «أضف».</p>' : "");
    if (!d.items.length) h += '<div class="empty">ابدأ بأول شيء يخطر ببالك.</div>';
    else h += '<ul class="list">' + d.items.map(function (it) {
      return '<li class="card"><div class="top"><span class="ttl">' + itemTitle(it) + '</span><button class="del" data-act="del" data-id="' + it.id + '" aria-label="حذف">×</button></div></li>';
    }).join("") + '</ul>';
    h += '</section><div class="navrow"><span class="muted small">' + d.items.length + ' بنود</span><button class="btn" data-act="step" data-n="2"' + (d.items.length ? "" : " disabled") + '>التالي: ميّز المهم ←</button></div>';
    return h;
  }
  function seg(it, field) {
    var v = it[field];
    return '<span class="seg"><button data-act="set" data-f="' + field + '" data-v="1" data-id="' + it.id + '" aria-pressed="' + (v === true) + '">نعم</button>' +
      '<button data-act="set" data-f="' + field + '" data-v="0" data-id="' + it.id + '" aria-pressed="' + (v === false) + '">لا</button></span>';
  }
  function step2(d) {
    var h = '<section><h2>ما المهم وما العاجل؟</h2>' +
      '<p class="muted small"><b>مهم</b>: يقرّبك من أهدافك أو له أثر كبير على دراستك وعبادتك وأسرتك وصحتك. <b>عاجل</b>: له موعد اليوم أو يسبّب مشكلة إن تأخّر.</p>' +
      '<div class="matrix"><div class="now"><b>مهم + عاجل</b>افعلها أولًا</div><div class="plan"><b>مهم + غير عاجل</b>خصّص لها وقتًا، هنا يكون التقدّم الحقيقي</div>' +
      '<div class="short"><b>عاجل + غير مهم</b>اختصرها أو اطلب من غيرك</div><div class="drop"><b>لا مهم ولا عاجل</b>اتركها اليوم</div></div>';
    h += '<ul class="list">' + d.items.map(function (it) {
      return '<li class="card"><div class="top"><span class="ttl">' + itemTitle(it) + '</span>' + qtag(it) + '</div>' +
        '<div class="qs"><span class="q">مهم؟ ' + seg(it, "important") + '</span><span class="q">عاجل؟ ' + seg(it, "urgent") + '</span></div></li>';
    }).join("") + '</ul></section>';
    var left = d.items.filter(function (i) { return quad(i) == null; }).length;
    h += '<div class="navrow"><button class="ghost" data-act="step" data-n="1">→ رجوع</button><span class="muted small">' + (left ? "بقي " + left : "تم التصنيف") + '</span><button class="btn" data-act="step" data-n="3">التالي ←</button></div>';
    return h;
  }
  function step3(d) {
    var cands = d.items.filter(function (i) { var q = quad(i); return q === "now" || q === "plan"; });
    var count = d.items.filter(function (i) { return i.top && !i.moved; }).length;
    var h = '<section><h2>اختر أهم ٣ أشياء لليوم</h2><p class="muted small">لو لم تُنجز اليوم إلا ثلاثة أشياء، فما هي؟ أعطها أفضل أوقات يومك.</p>';
    if (!cands.length) h += '<div class="empty">لا توجد بنود مهمة بعد. ارجع للخطوة ٢ وحدّد المهم.</div>';
    else h += '<ul class="list">' + cands.map(function (it) {
      return '<li class="card"><div class="top"><span class="ttl">' + itemTitle(it) + '</span><button class="starbtn" data-act="top" data-id="' + it.id + '" aria-pressed="' + !!it.top + '">' + (it.top ? "★ من أهم ٣" : "☆ اختر") + '</button></div></li>';
    }).join("") + '</ul>';
    h += '</section><div class="navrow"><button class="ghost" data-act="step" data-n="2">→ رجوع</button><span class="muted small">' + count + ' من ٣</span><button class="btn" data-act="step" data-n="4">التالي ←</button></div>';
    return h;
  }
  function step4(d) {
    var list = d.items.filter(function (i) { return quad(i) !== "drop" && !i.moved; });
    var dropped = d.items.filter(function (i) { return quad(i) === "drop"; });
    var total = list.reduce(function (s, i) { return s + (i.dur || 0); }, 0);
    var h = '<section><h2>ضع لكل شيء وقتًا</h2><p class="muted small">مجموع ما خطّطت له: <b>' + fmtH(total) + '</b>. ضع أهم ٣ في وقت نشاطك، واترك وقتًا للراحة.</p>' +
      '<div class="tip"><h3>رتّبها لي تلقائيًا</h3><p class="small muted">أبدأ يومي الساعة:</p>' +
      '<div class="addform"><input class="field" type="time" id="startAt" value="' + (d.startAt || "08:00") + '" aria-label="وقت البداية"><button class="btn" data-act="auto">رتّب</button></div>' +
      '<p class="small muted">العاجل المهم أولًا، ثم أهم ٣، ثم الباقي، مع ١٠ دقائق راحة بين المهام. المهام الدائمة التي لها وقت تبقى في وقتها.</p></div>';
    if (!list.length) h += '<div class="empty">لا توجد بنود. ارجع للخطوة ١.</div>';
    else h += '<ul class="list">' + list.map(function (it) {
      return '<li class="card"><div class="top"><span class="ttl">' + itemTitle(it) + '</span>' + qtag(it) + '</div>' +
        '<div class="timerow">الساعة <input class="field" type="time" value="' + (it.time || "") + '" data-act="time" data-id="' + it.id + '" aria-label="الوقت"> لمدة ' + durSelect('data-act="dur" data-id="' + it.id + '"', it.dur) + '</div></li>';
    }).join("") + '</ul>';
    if (dropped.length) h += '<p class="muted small">تركتَ اليوم: ' + dropped.map(function (i) { return esc(i.title); }).join("، ") + '</p>';
    h += '</section><div class="navrow"><button class="ghost" data-act="step" data-n="3">→ رجوع</button><button class="btn" data-act="startDay">ابدأ يومي ✓</button></div>';
    return h;
  }
  function autoArrange() {
    var d = day(), st = $("startAt") ? $("startAt").value : d.startAt;
    if (!st) { toast("اختر وقت البداية أولًا"); return; }
    d.startAt = st;
    var live = d.items.filter(function (i) { return quad(i) !== "drop" && !i.moved && !i.done; });
    var fixed = live.filter(function (i) { return i.rid && i.time; }).map(function (i) { return [toMin(i.time), toMin(i.time) + (i.dur || 60)]; });
    var rank = function (i) { var q = quad(i); return q === "now" ? 0 : i.top ? 1 : q === "plan" ? 2 : q === "short" ? 3 : 4; };
    var list = live.filter(function (i) { return !(i.rid && i.time); }).sort(function (a, b) { return rank(a) - rank(b); });
    var cur = toMin(st);
    list.forEach(function (i) {
      var len = i.dur || 60, moved = true;
      while (moved) { // skip past any fixed block it would overlap
        moved = false;
        fixed.forEach(function (f) { if (cur < f[1] && cur + len > f[0]) { cur = f[1] + 10; moved = true; } });
      }
      i.time = fromMin(cur);
      cur += len + 10;

    save(); render(); toast("تم الترتيب، عدّل ما تشاء");
  }

  /* ---------- DAY ---------- */
  function catSummary(items) {
    var by = {}, order = [];
    items.forEach(function (i) { if (by[i.cat] == null) { by[i.cat] = 0; order.push(i.cat); } by[i.cat] += i.dur || 0; });
    return '<div class="catsum">' + order.map(function (c) { var o = catOf(c); return '<span class="cat" style="--cc:var(--c' + o.color + ')"><i></i>' + esc(o.name) + ' <b>' + fmtH(by[c]) + '</b></span>'; }).join("") + '</div>';
  }
  function quickAddHtml(title, ph) {
    return '<section><h2>' + title + '</h2><form class="addform" data-form="quick"><input class="field grow" id="quickTitle" type="text" placeholder="' + ph + '" autocomplete="off">' +
      catSelect('id="quickCat"', ui.lastCat) + '<input class="field" id="quickTime" type="time" aria-label="الوقت (اختياري)"><button class="btn" type="submit">أضف</button></form>' +
      '<p class="small muted">الوقت اختياري. وللملاحظة الطويلة اضغط على البند بعد إضافته واكتبها تحته.</p></section>';
  }
  function dayView() {
    var d = day(), items = active(d);
    if (!d.items.length) return sleepCard() + '<div class="empty"><p>لم تخطّط لهذا اليوم بعد.</p><button class="btn" data-act="tab" data-tab="plan">خطّط ليومك في ٤ خطوات</button></div>' +
      quickAddHtml("أو أضف مهمة أو ملاحظة سريعة", "مثل: موعد طبيب الأسنان");
    var st = dayStats(d), pct = Math.min(100, Math.round(st.rate * 100));
    var h = '<div class="progress"><span>إنجاز اليوم</span><div class="bar"><i style="width:' + pct + '%"></i></div><b>' + pct + '%</b></div>' + catSummary(items);
    var top = items.filter(function (i) { return i.top; });
    if (top.length) {
      h += '<div class="top3"><h2>★ أهم ما في يومك</h2>' + top.map(function (it) {
        return '<label class="row' + (it.done ? " done" : "") + '"><input type="checkbox" class="check" data-act="done" data-id="' + it.id + '"' + (it.done ? " checked" : "") + '><span class="t">' + esc(it.title) + '</span>' + (it.time ? '<span class="muted small">' + fmt12(it.time) + '</span>' : "") + '</label>';
      }).join("") + '</div>';
    }
    var timed = items.filter(function (i) { return i.time; }).sort(function (a, b) { return toMin(a.time) - toMin(b.time); });
    var untimed = items.filter(function (i) { return !i.time; });
    var nowId = null;
    if (offsetOf(dk()) === 0) {
      var n = new Date(), nm = n.getHours() * 60 + n.getMinutes();
      timed.forEach(function (i) { var s = toMin(i.time); if (nm >= s && nm < s + (i.dur || 60)) nowId = i.id; });
    }
    var side = sleepCard() + h; h = "";
    h += '<section><div class="sechead"><h2>جدول اليوم</h2><span class="muted small">اضغط على أي بند لتعديله</span></div>';

    else h += '<ul class="timeline">' + timed.map(function (it) { return slot(it, nowId); }).join("") + '</ul>';
    h += '</section>';
    if (untimed.length) h += '<section><h2>بدون وقت</h2><ul class="timeline">' + untimed.map(function (it) { return slot(it, null); }).join("") + '</ul></section>';
    var add = quickAddHtml("أضف شيئًا طرأ", "ماذا طرأ؟");
    return '<div class="daygrid"><div class="dtop">' + side + '</div><div class="dmain">' + h + '</div><div class="dbottom">' + add + '</div></div>';
  }
  function slot(it, nowId) {

  // A PIN keeps casual hands out of an account. It is a lock on this screen, not encryption of the stored data.
  function pinHash(id, pin) {
    var data = new TextEncoder().encode("yawmi:" + id + ":" + pin);
    return crypto.subtle.digest("SHA-256", data).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) { return (b < 16 ? "0" : "") + b.toString(16); }).join("");
    });
  }
  function setPin(raw) {

    pinHash(PROFILE, pin).then(function (h) {
      currentProfile().pin = h; saveProfiles();
      try { sessionStorage.setItem("yawmi-unlocked:" + PROFILE, "1"); } catch (e) {}
      render(); toast("قُفل الحساب. احفظ الرمز جيدًا 🔒");

        var chChanged = ch !== cloud.chan;
        cloud.role = role; cloud.num = num; cloud.chan = ch; saveCode();
        if (chChanged) liveInit();
      }
      COLS.forEach(function (c, i) {
        var v = row[c];
        if (v && typeof v === "object") remote[v.date || keyOf(addDays(parseKey(base), i - SPAN))] = v;
      });
      var changed = false, upload = base !== todayKey; // the seven fields slide when the day changes
      if (state.sample && (Object.keys(remote).length || row.settings)) { dropSample(); changed = true; }
      var merged = {};
      windowKeys().forEach(function (k) {
        var L = localDay(k), R = remote[k] ? normDay(remote[k]) : null, M = mergeDay(L, R);
        merged[k] = M;
        if (!M) return;
        if (canon(M) !== canon(L ? normDay(L) : null)) { state.days[k] = M; snap[k] = daySnap(M); changed = true; }
        if (canon(M) !== canon(R)) upload = true;
      });
      var rs = row.settings, rst = rs ? (rs.updatedAt || 0) : -1, lst = state.settings.updatedAt || 0;
      if (rs && rst > lst) {
        state.settings = { categories: arr(rs.categories).length ? rs.categories : defaultCats(), routines: arr(rs.routines), sleep: rs.sleep || state.settings.sleep, updatedAt: rst };
        snap._s = setJson(); changed = true;
      } else if (lst > rst) upload = true;
      fixState(); persist();
      if (changed) softRender();
      if (!upload) return;
      var data = { base_date: todayKey, settings: { categories: state.settings.categories, routines: state.settings.routines, sleep: state.settings.sleep, updatedAt: state.settings.updatedAt || 0 } };
      windowKeys().forEach(function (k, i) { data[COLS[i]] = merged[k] ? toRemote(k, merged[k]) : null; });
      return rpc("save", { p_code: code, p_data: data }).then(function (r2) {
        if (r2.error) throw r2.error;
        if (r2.data === false) throw new Error("لم يُعثر على صفك في السحابة. تأكد من الكود.");
        nudge();
      });
    }).then(function () {
      cloud.status = "ok"; cloud.msg = ""; cloud.last = Date.now();
      flushLog();
      if (!pushRefreshed) { pushRefreshed = true; pushRefresh(); }
    }, function (e) {
      if (e && e.gone) {
        syncing = false;
        forgetDevice(cloud.role === "secondary" ? "أُلغي ربط هذا الجهاز من المسؤول الأول. بياناتك باقية عليه، ويمكنك ربطه من جديد." : "لم يُعثر على حسابك في السحابة. تأكد من الكود.");
        return;
      }
      cloud.status = navigator.onLine ? "error" : "offline";
      cloud.msg = navigator.onLine ? "تعذّرت المزامنة: " + netError(e) : "";
    }).then(function () {
      syncing = false;
      if (!code) return;
      refreshCloud();
      if (again) { again = false; syncNow(); }
    });
  }


  /* ---------- pairing by QR, like WhatsApp Web ---------- */
  // The device without a code shows a QR of a one-time link; the phone that has the code opens it
  // and hands its code over through Supabase; the waiting device picks it up.
  var pairTimer = null;
  function appUrl() { return location.origin + location.pathname; }
  function pairStop() { clearTimeout(pairTimer); ui.pair = null; }
  function pairStart() {
    cloud.msg = "";
    rpc("pair_start").then(function (r) {
      if (r.error || !r.data) { cloud.msg = "تعذّر إنشاء رمز الربط: " + netError(r.error); refreshCloud(); return; }
      ui.pair = { token: r.data, until: Date.now() + 10 * 60000 };
      render(); pairPoll();
    }, function (e) { cloud.msg = netError(e); refreshCloud(); });
  }
  function pairPoll() {
    clearTimeout(pairTimer);
    if (!ui.pair) return;
    if (Date.now() > ui.pair.until) { pairStop(); cloud.msg = "انتهت صلاحية الرمز. اضغط «اربط بجوالي عبر QR» لرمز جديد."; refreshCloud(); return; }
    pairTimer = setTimeout(function () {
      if (!ui.pair) return;
      rpc("pair_take", { p_token: ui.pair.token, p_label: deviceLabel() }).then(function (r) {
        if (!r.error && r.data && r.data.token) {
          pairStop(); setLink(r.data.token, "secondary", r.data.num);
          render(); toast("تم الربط ✓ هذا الجهاز رقم " + r.data.num); syncNow();
        } else pairPoll();
      }, pairPoll);
    }, 2000);
  }
  // Links opened from a scanned QR: #join=<code> (new device joins) or #pair=<token> (first owner approves)
  function handleLink() {
    var m = /^#(pair|join)=([a-z0-9-]+)$/i.exec(location.hash || "");
    if (!m) return;
    try { history.replaceState(null, "", appUrl()); } catch (e) {}
    if (!sb) { toast("الحفظ السحابي غير مفعّل على هذا الجهاز"); return; }
    if (m[1].toLowerCase() === "join") {
      if (code) { toast("هذا الجهاز مربوط بالفعل"); return; }
      ui.tab = "settings"; render(); joinWith(m[2]); return;
    }
    if (!code || cloud.role === "secondary") {
      ui.tab = "settings"; render();
      toast("افتح هذا الرابط على الجهاز المسؤول الأول");
      return;
    }
    rpc("pair_approve", { p_token: cleanCode(m[2]), p_code: code }).then(function (r) {
      if (r.error) { toast("تعذّر الربط: " + netError(r.error)); return; }
      toast(r.data ? "تم ربط الجهاز الآخر ✓" : "انتهت صلاحية الرمز، اطلب رمزًا جديدًا");
      if (r.data) setTimeout(loadDevices, 2500);
    }, function () { toast("تعذّر الاتصال. تأكد من الإنترنت."); });
  }

  window.addEventListener("online", syncNow);
  window.addEventListener("offline", function () { if (code && sb) { cloud.status = "offline"; refreshCloud(); } });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) return;
    pruneLocal(); // the 7-day window moves at midnight
    var o = offsetOf(dk());
    if (o < -ARCHIVE || o > FUTURE) current = today();
    persist();
    loadTip();
    renderProfile();
    syncNow();
    softRender();
  });
  setInterval(function () { if (!document.hidden) syncNow(); }, 60000);

  // Refresh the "now" highlight each minute, unless the user is typing
  setInterval(function () { if (ui.tab === "day" && !isTyping()) render(); }, 60000);

  cloudInit();
  loadTip();
  render();
  handleLink();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
